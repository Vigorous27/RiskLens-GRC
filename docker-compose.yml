services:
  postgres:
    image: postgres:18-alpine
    container_name: risklens-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: risklens
      POSTGRES_PASSWORD: risklens_dev_password
      POSTGRES_DB: risklens

    ports:
      - "5432:5432"

    volumes:
      - risklens_postgres_data:/var/lib/postgresql

volumes:
  risklens_postgres_data: